[package]
name = "freight-fate"
description = "Freight Fate: an accessible, audio-first cross-country trucking simulation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
name = "freight_fate"
path = "src/lib.rs"

[[bin]]
name = "freightfate"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ff-core = { path = "../ff-core" }
prism = { path = "../prism" }
bass-sys = { path = "../bass-sys" }
anyhow.workspace = true
thiserror.workspace = true
log.workspace = true
env_logger.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
flate2.workspace = true
zip.workspace = true
tar.workspace = true
ureq.workspace = true
keyring.workspace = true
discord-rich-presence.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
regex.workspace = true
sdl2 = { workspace = true, features = ["raw-window-handle"] }
url.workspace = true
form_urlencoded.workspace = true
webbrowser.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
raw-window-handle.workspace = true

# Windows links SDL2 against the prebuilt import library under `vendor/sdl2/`,
# which build.rs puts on the linker's search path. macOS builds SDL2 from
# source and links it statically (`bundled` + `static-link`), so the shipped
# app depends on no SDL dylib at all. It used to come from Homebrew via
# `use-pkgconfig`, until Homebrew retired the real SDL2: `brew install sdl2`
# now installs sdl2-compat, a shim that loads SDL3 at RUNTIME -- invisible to
# any install-name audit -- so the bundled app died on every tester Mac
# without Homebrew's SDL3 ("failed to load sdl3", 2026-08-30).
[target.'cfg(target_os = "macos")'.dependencies]
sdl2 = { workspace = true, features = ["bundled", "static-link"] }

# Linux compiles SDL2 in the same way, for a different reason: every distro
# ships a libSDL2-2.0.so.0, but not the same one, and a tarball that has to
# run on Fedora, Arch and Debian alike cannot pick which. The static build
# still opens X11, Wayland, PulseAudio, PipeWire and ALSA through dlopen at
# run time, so what the player's machine lacks is skipped rather than fatal,
# and the executable itself depends on nothing but libc.
[target.'cfg(target_os = "linux")'.dependencies]
sdl2 = { workspace = true, features = ["bundled", "static-link"] }

[dev-dependencies]
tempfile.workspace = true
