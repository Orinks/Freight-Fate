# The game is Rust. Ruff covers the Python build and data tooling under
# tools/ and its tests. The Rust world loader still reads the indexed
# world_data tree derived from world_source, so keep that check here.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --all --check
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff-check-fix
        name: Ruff lint and import fixes
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        # sound-test/ holds audition scratch scripts outside CI's lint scope
        # (`ruff check tests tools`); a path fix there must not reformat them.
        exclude: ^sound-test/
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        exclude: ^sound-test/
        stages: [pre-commit]
      - id: world-data-index
        name: world_data is in sync with world_source
        entry: uv run python tools/index_world.py --check
        language: system
        files: ^data/world_source/.*\.json$
        pass_filenames: false
        stages: [pre-commit]
      - id: radio-imported-catalog
        name: radio_imported.json matches a rebuild
        entry: uv run python tools/import_radio_catalog.py --check
        language: system
        files: ^(data/radio_(imported_overrides|stream_health)\.json|tools/import_radio_catalog\.py|data/radio_imported\.json)$
        pass_filenames: false
        stages: [pre-commit]
      - id: freight-fate-release-notes
        name: Freight Fate release-note gate
        entry: uv run python -m tools.release_notes check --base auto --head HEAD
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
