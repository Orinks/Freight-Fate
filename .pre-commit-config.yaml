# Career 1.9 gameplay is Rust. Ruff remains for Python maintenance outside
# the retired reference gameplay suite. The Rust world loader still reads the
# indexed world_data tree derived from world_source, so keep that check here.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --all --check
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff-check-fix
        name: Ruff lint and import fixes
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        exclude: ^src/freight_fate/
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        exclude: ^src/freight_fate/
        stages: [pre-commit]
      - id: world-data-index
        name: world_data is in sync with world_source
        entry: uv run python tools/index_world.py --check
        language: system
        files: ^src/freight_fate/data/world_source/.*\.json$
        pass_filenames: false
        stages: [pre-commit]
      - id: freight-fate-release-notes
        name: Freight Fate release-note gate
        entry: uv run python -m tools.release_notes check --base auto --head HEAD
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
