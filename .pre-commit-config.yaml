# Career 1.9 pre-commit: gameplay is Rust. Python ruff is maintainer tooling
# only, not a 1.9 gameplay suite. The 1.8 world_source -> world_data index
# hook is gone -- the 1.9 runtime loads world_data via Rust (and the baked
# container), not the Python world_source tree.
repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt --all --check
        entry: cargo fmt --all --check
        language: system
        types: [rust]
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff-check-fix
        name: Ruff lint and import fixes
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        files: ^tools/
        stages: [pre-commit]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
        files: ^tools/
        stages: [pre-commit]
      - id: freight-fate-release-notes
        name: Freight Fate release-note gate
        entry: uv run python -m tools.release_notes check --base auto --head HEAD
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-push]
