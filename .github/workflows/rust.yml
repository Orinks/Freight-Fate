# Rust port CI.
#
# Builds and tests the Cargo workspace (`crates/*`). The Python suite has its
# own workflow (`ci.yml`) and is untouched by this one; both run side by side
# for as long as the port keeps the Python package as its reference
# implementation.
#
# Why this is its own workflow rather than another job in ci.yml: ci.yml's
# jobs share a Python/uv setup and a coverage upload that mean nothing here,
# and its `build` job gates on `test`, which would make a Rust failure block
# the Python wheel. Keeping them apart also keeps the Rust matrix free to be
# Windows-only (see below) without teaching ci.yml's matrix about exceptions.
#
# Trigger note: `build.yml` fires only on `schedule`, `v*.*.*` tags and
# `workflow_dispatch` -- it never sees an ordinary push -- so nothing there
# will ever run these checks. Anything that must run on a push needs its own
# push trigger, which is what this file has for main, dev, and the direct-push
# Rust release lines.
#
# What a push runs, and what it leaves to the nightly (2026-09-02). A push
# used to take twelve minutes: six of them compiling the workspace crates on
# the hosted Windows runner, four running the tests, and the rest clippy and
# setup, all in one job. Now:
#
#   * Clippy is its own job, in parallel with the tests, with its own cache.
#   * The test job passes `--cfg ci_quick`, which turns every
#     `#[cfg_attr(ci_quick, ignore = "sweep: ...")]` test into an ignored one.
#     Those are the whole-map sweeps -- a 500-mile delivery per state line,
#     every facility exit, every kind of destination, ~96 job origins --
#     and the sixteen of them in the game crate cost as much as the other
#     2,400 tests together. They still run in full on the nightly Career 1.9
#     snapshot (`build-career-1.9.yml`, which sets no cfg), on a manual
#     `workflow_dispatch` of this workflow, and in any local `cargo test`.
#   * sccache caches the workspace crates' own compilation by content, so a
#     commit that leaves ff-core alone (most of them) does not rebuild it.
#   * Windows Defender is told not to scan the build tree; real-time scanning
#     of a few thousand object files is a known multiple on a Windows runner.
#   * BASS is restored from the Actions cache instead of un4seen's site.
#
# The build's own timing report is uploaded as an artifact on every run, so
# the next person who asks "where do the minutes go" can open
# cargo-timing.html instead of guessing.

name: Rust

permissions:
  contents: read

on:
  push:
    # Alongside main and dev, the Rust release lines take direct pushes instead
    # of PRs, so each needs its own entry for this CI to run.
    branches: [main, dev, feat/career-1.9, feat/rust-port]
  pull_request:
    branches: [main, dev]
    paths:
      - "crates/**"
      - "vendor/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  # A manual run is the FULL suite: no `--cfg ci_quick`, sweeps included.
  workflow_dispatch:

# The pull-request path filter keeps the Windows build off PRs that only
# touch Python, docs or world data. A *required* check that is path filtered
# stays "expected -- waiting for status" forever on a skipped PR, so do not
# make it required unless the filter is dropped.

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    # Formatting needs no native library and no build, so it runs on the cheap
    # Linux runner and fails in under a minute instead of thirty.
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install the pinned toolchain
        # rust-toolchain.toml names the channel and the rustfmt/clippy
        # components; `rustup show` is what materialises it before the first
        # cargo call, so a missing component fails here with a clear message
        # rather than mid-lint.
        run: rustup show

      - name: cargo fmt --check
        run: cargo fmt --all --check

  clippy:
    # Windows, like the tests, so the `#[cfg(windows)]` half of the game
    # (single-instance guard, console, keyring) is linted too. Its own job
    # rather than a step ahead of the tests: clippy's check artefacts share
    # nothing with a test build, so the minute it took was pure critical
    # path. It needs no BASS -- bass-sys builds without the DLL and only
    # warns -- and keeps its own cache line, because a rust-cache entry holds
    # one job's artefacts and two jobs saving under one key would take turns
    # evicting each other.
    name: Clippy (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Install the pinned toolchain
        run: rustup show

      - name: Keep Defender off the build tree
        # Real-time scanning on the hosted Windows image inspects every
        # object file rustc writes and every one the linker reads back. The
        # image runs as an administrator, so an exclusion is one cmdlet; if
        # the image ever ships without Defender the try/catch keeps this a
        # note in the log rather than a failed job.
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup" -ErrorAction Stop
            Write-Host "Defender exclusions added for the workspace, cargo and rustup."
          } catch {
            Write-Host "Could not add Defender exclusions ($_); building without them."
          }

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-windows-clippy
          cache-on-failure: true

      - name: cargo clippy
        # Workspace-wide and every target, so test and bench code is linted
        # too; warnings are errors, as the port plan requires.
        #
        # `--locked`: Cargo.lock is committed, so a dependency bump that was
        # not locked in should fail here loudly rather than silently resolve
        # to something no developer has run.
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    # Windows only, deliberately.
    #
    # The workspace links SDL2 dynamically against the prebuilt libsdl-org
    # release under `vendor/sdl2/<os>-<arch>/`, and loads BASS and Prism at
    # run time out of `crates/bass-sys/vendor/<os>-<arch>/` and
    # `crates/prism-sys/vendor/<os>-<arch>/`. Today the tree carries:
    #
    #   vendor/sdl2/            windows-x86_64 only
    #   crates/bass-sys/vendor/ windows-x86_64 (fetched), macos-* (fetched)
    #   crates/prism-sys/vendor/windows-x86_64, macos-x86_64, macos-aarch64
    #
    # So an ubuntu-latest job would have no vendored SDL2 to link against --
    # `crates/freight-fate/build.rs` would print its "expecting a system SDL2"
    # warning and the link would then fail on the runner -- and no BASS at
    # all. Installing `libsdl2-dev` there would get it to link, but it would
    # be testing a configuration nobody ships and nobody has ever run, and the
    # audio and speech loaders would silently fall back to their null
    # backends.
    #
    # macOS is a different gap: it builds from source (BASS is fetched for
    # both architectures, Prism is vendored, SDL2 is compiled in statically),
    # and the nightly snapshot workflow does test it there; this per-push
    # workflow does not, because the Mac runner is the slow one.
    #
    # Windows is the primary target and the only fully vendored one, so this
    # matrix is honest about the gap instead of papering over it: Linux and
    # macOS are NOT covered by this workflow.
    name: Test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # The same headless trio the Python jobs use: no speech synthesiser, no
      # window, no audio device on a hosted runner.
      FREIGHT_FATE_NO_SPEECH: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      # Keep cargo's own diagnostics legible in the Actions log viewer.
      CARGO_TERM_COLOR: always
      # Backtraces cost nothing here and turn a bare "assertion failed" into
      # something diagnosable without a re-run.
      RUST_BACKTRACE: "1"
      # Pushes and PRs run the quick set (see the header); a manual dispatch
      # runs everything. The expression reads: when this is a push or a PR,
      # the flag; otherwise the empty string. (`cond && a || b` is the
      # Actions idiom for a conditional -- it works here because the flag is
      # never empty, so `&&` cannot fall through to `||` by accident.)
      RUSTFLAGS: ${{ (github.event_name == 'push' || github.event_name == 'pull_request') && '--cfg ci_quick' || '' }}
      # sccache in front of rustc, backed by the Actions cache. rust-cache
      # below restores the DEPENDENCIES' artefacts and deliberately drops the
      # workspace crates' own, which cargo would rebuild anyway (a fresh
      # checkout stamps every source newer than the cache). sccache keys on
      # content instead, so an ff-core that did not change is a hit even
      # though its files are new. Incremental compilation is already off on
      # CI (rust-cache sets CARGO_INCREMENTAL=0), which is what sccache
      # needs to cache a crate at all.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
    steps:
      # Keep LFS disabled: the large music pack is not needed for Rust CI.
      # sounds.pak is a regular tracked file, so checkout already provides it
      # without a separate LFS fetch.
      - uses: actions/checkout@v6
        with:
          lfs: false

      - name: Install the pinned toolchain
        run: rustup show

      - name: Keep Defender off the build tree
        # See the clippy job for why.
        shell: pwsh
        run: |
          try {
            Add-MpPreference -ExclusionPath "${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup" -ErrorAction Stop
            Write-Host "Defender exclusions added for the workspace, cargo and rustup."
          } catch {
            Write-Host "Could not add Defender exclusions ($_); building without them."
          }

      - name: Restore BASS from the cache
        # BASS is un4seen's and proprietary, so it is not committed to this
        # public repository (see crates/bass-sys/vendor/licenses/README.md).
        # The fetch tool pins every file by sha256, so the tool's own hash is
        # the right cache key: bump a pin and the cache misses.
        id: bass
        uses: actions/cache@v4
        with:
          path: crates/bass-sys/vendor/windows-x86_64/*.dll
          key: bass-windows-${{ hashFiles('tools/fetch_bass.py') }}

      - name: Fetch BASS
        # Only on a cache miss. The AAC add-on has no public download: the
        # fetch tool lifts it out of the sound_lib package in the project
        # venv, which is why this needs uv and a dependency sync (about
        # twenty seconds) rather than the runner's bare interpreter.
        if: steps.bass.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python -m pip install --quiet uv
          uv run python tools/fetch_bass.py

      - name: Check BASS
        # Every run, hit or miss. Without BASS bass-sys still builds and
        # every audio test skips itself, which reads as a green run that
        # proved nothing about the audio backend -- so --check fails the job
        # rather than letting that pass. The check is standard-library
        # Python, so the runner's own interpreter is enough.
        run: python tools/fetch_bass.py --check

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache cargo registry and target directory
        # Swatinem/rust-cache rather than a raw actions/cache on target/: it
        # keys on the lockfile plus the rustc version (and RUSTFLAGS), and
        # prunes the target directory to the dependency artefacts before
        # saving. An unpruned target/ for this workspace is several GB --
        # well past the 10 GB repository cache budget after a couple of
        # branches.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-windows
          cache-on-failure: true

      - name: Build the test binaries
        # The build on its own so the timing report below covers exactly the
        # compile, and so a compile failure reads as one. `--locked`: see the
        # clippy job. ONE invocation for both crates, not one per crate:
        # split, cargo compiled ff-core twice (once as its own test target,
        # once as freight-fate's dependency) in two sequential builds with
        # separate link phases (2026-08-29).
        run: cargo test -p ff-core -p freight-fate --no-run --locked --timings

      - name: Show the staged native libraries
        # The build scripts (crates/bass-sys/build.rs, crates/prism-sys/
        # build.rs, crates/freight-fate/build.rs) copy the vendored DLLs out
        # of the committed vendor directories into target/<profile>/. Verified
        # on a clean target directory in this repo: one cargo invocation with
        # nothing else done by hand leaves SDL2.dll, bass.dll, bass_aac.dll,
        # bassflac.dll, basshls.dll, bassopus.dll and prism.dll beside the
        # binary. The test executables themselves live in
        # target/<profile>/deps/, and `cargo test` prepends both that
        # directory and target/<profile> to PATH before running one, which is
        # how they resolve SDL2.dll; run such a binary by hand without that
        # PATH and it dies with "SDL2.dll: cannot open shared object file".
        # This listing exists so that if a vendor directory ever goes missing,
        # the log names the library that did not get staged instead of leaving
        # a link or load error two steps later to be decoded.
        shell: bash
        run: ls -l target/debug/*.dll

      - name: cargo test
        # Everything is fresh from the step above, so this is the run alone.
        # Each test binary still reports separately, so a failure names which
        # crate it came from.
        run: cargo test -p ff-core -p freight-fate --locked

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

      - name: Upload the build timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timing
          path: target/cargo-timings/cargo-timing.html
          if-no-files-found: ignore

  changelog:
    # The changelog gate runs locally as a pre-push hook, which not every
    # clone has installed. ci.yml used to enforce it on this branch; that
    # workflow no longer runs on feat/career-1.9 (Python pytest stays on
    # main/dev), so this job is the CI gate for the 1.9 release line. Same
    # tool and skip markers as the pre-push hook (`tools.release_notes`
    # check; `[skip changelog]` / `changelog: none`).
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history, because the check walks base..HEAD for commit
          # messages -- but without the blobs. The pack is 840 MB of world
          # data churn, and this job needs commits, trees and one changelog
          # blob per ref (`git show <ref>:CHANGELOG.md`), which a blobless
          # clone fetches on demand. Three minutes of checkout became thirty
          # seconds (2026-09-02).
          fetch-depth: 0
          filter: blob:none
          lfs: false

      - name: Require a changelog entry for user-facing changes
        env:
          # PRs diff against their target branch; pushes diff against the
          # ref the branch pointed at before this push.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && ! git cat-file -e "$BASE" 2>/dev/null; then
            # A brand-new branch pushes an all-zeros "before", and a force
            # push can point at history this clone no longer has.
            echo "Base commit $BASE unavailable (new branch or force push); skipping."
            exit 0
          fi
          python3 tools/release_notes.py check --base "$BASE" --head HEAD
