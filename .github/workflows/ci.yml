name: CI

permissions:
  contents: read
  actions: write

on:
  push:
    # The 1.9 release line has its own Rust CI in rust.yml.
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # The Python that still SHIPS: the build, bake, indexing and release tooling
  # under tools/, plus the workflow and sound-pack guards. The game is Rust and
  # rust.yml proves it; the Python game itself was deleted in the 2026-09-21
  # sunset.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      FREIGHT_FATE_NO_SPEECH: "1"
      # sys.monitoring coverage core (Python 3.12+): cheaper than the default
      # tracer on the CPU-bound bake and sweep tools this job still runs.
      COVERAGE_CORE: sysmon
    steps:
      # sounds.pak is an ordinary 7.8 MB blob in git now, not a Git LFS object
      # (see .gitattributes), so a plain checkout carries the real pack and
      # the audio tests run here on every push. They used to depend on an LFS
      # fetch: once the repository's LFS budget ran out that fetch returned a
      # 132 byte pointer, and the tests either failed against it or skipped
      # themselves -- a green run that had not checked a single sound. Only
      # the 250 MB music.pak stays outside the repository, and the tests that
      # read it skip here by design.
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check tests tools sound-test

      - name: Run tests
        run: uv run pytest tests/ -n auto --durations=15 --cov=tools --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml

  changelog:
    # The changelog gate runs locally as a pre-push hook, which not every
    # clone has installed; this enforces it on every PR and also on direct
    # pushes to dev and main, which would otherwise slip past ungated.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require a changelog entry for user-facing changes
        env:
          # PRs diff against their target branch; pushes diff against the
          # ref the branch pointed at before this push.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] && ! git cat-file -e "$BASE" 2>/dev/null; then
            # A brand-new branch pushes an all-zeros "before", and a force
            # push can point at history this clone no longer has.
            echo "Base commit $BASE unavailable (new branch or force push); skipping."
            exit 0
          fi
          python3 tools/release_notes.py check --base "$BASE" --head HEAD
