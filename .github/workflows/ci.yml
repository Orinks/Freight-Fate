name: CI

permissions:
  contents: read
  actions: write

on:
  push:
    # The 1.9 release line has its own Rust CI in rust.yml.
    branches: [main, dev]
    paths:
      # What the Python suite reads, measured by auditing every file pytest
      # opened (2026-10-08): the tools and their tests, the world data and
      # sound assets they check, the workflows the guards parse, and a few
      # files outside those trees. A Rust-only push skips this workflow;
      # rust.yml covers it. The changelog gate is NOT filtered: it lives in
      # changelog.yml and runs on every change.
      - "tools/**"
      - "tests/**"
      - "sound-test/**"
      - "data/**"
      - "assets/**"
      - "docs/**"
      - "crates/*/Cargo.toml"
      - "crates/ff-core/src/music.rs"
      - "crates/ff-core/src/music/**"
      - ".cargo/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "build-release.sh"
      - "build-release.ps1"
      - ".gitignore"
      - ".gitattributes"
  pull_request:
    branches: [main, dev]
    # Keep in step with the push list (tests/test_ci_workflow.py checks).
    paths:
      - "tools/**"
      - "tests/**"
      - "sound-test/**"
      - "data/**"
      - "assets/**"
      - "docs/**"
      - "crates/*/Cargo.toml"
      - "crates/ff-core/src/music.rs"
      - "crates/ff-core/src/music/**"
      - ".cargo/**"
      - ".github/workflows/**"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "build-release.sh"
      - "build-release.ps1"
      - ".gitignore"
      - ".gitattributes"
  workflow_dispatch:

# A newer push to the same branch or PR supersedes the run in flight, as in
# rust.yml.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Python that still SHIPS: the build, bake, indexing and release tooling
  # under tools/, plus the workflow and sound-pack guards. The game is Rust and
  # rust.yml proves it; the Python game itself was deleted in the 2026-09-21
  # sunset.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      FREIGHT_FATE_NO_SPEECH: "1"
      # sys.monitoring coverage core (Python 3.12+): cheaper than the default
      # tracer on the CPU-bound bake and sweep tools this job still runs.
      COVERAGE_CORE: sysmon
    steps:
      # sounds.pak is an ordinary 7.8 MB blob in git now, not a Git LFS object
      # (see .gitattributes), so a plain checkout carries the real pack and
      # the audio tests run here on every push. They used to depend on an LFS
      # fetch: once the repository's LFS budget ran out that fetch returned a
      # 132 byte pointer, and the tests either failed against it or skipped
      # themselves -- a green run that had not checked a single sound. Only
      # the 250 MB music.pak stays outside the repository, and the tests that
      # read it skip here by design.
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check tests tools sound-test

      - name: Run tests
        run: uv run pytest tests/ -n auto --durations=15 --cov=tools --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
