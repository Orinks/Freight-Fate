name: Retry failed nightly

# One workflow to watch since the 1.9 cutover (2026-09-20): build.yml was
# deleted with the 1.8 line, so "Career 1.9 snapshot" is the nightly and
# `dev` is the branch it builds.

on:
  workflow_run:
    workflows: [Career 1.9 snapshot]
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: retry-nightly-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  SNAPSHOT_WORKFLOW: "Career 1.9 snapshot"
  SNAPSHOT_BRANCH: "dev"

jobs:
  retry:
    name: Retry once after delay
    # A job that hits its timeout ends the run as `cancelled`, not `failure`
    # (2026-10-02: a hung Fedora ARM boot cost that night's snapshot).
    if: >-
      github.event.workflow_run.event == 'schedule' &&
      contains(fromJSON('["failure", "cancelled", "timed_out"]'), github.event.workflow_run.conclusion) &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Wait for a transient failure to clear
        run: sleep 2700

      - name: Dispatch one recovery build if still needed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="1.9-tester-$(date -u +%Y%m%d)"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists; the snapshot recovered while waiting."
            exit 0
          fi

          ACTIVE=$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow "$SNAPSHOT_WORKFLOW" --branch "$SNAPSHOT_BRANCH" --limit 20 \
            --json status --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length')
          if [ "$ACTIVE" -gt 0 ]; then
            echo "A snapshot is already queued or running; not dispatching a duplicate."
            exit 0
          fi

          echo "Scheduled snapshot is still missing after 45 minutes; dispatching one retry."
          gh workflow run "$SNAPSHOT_WORKFLOW" --repo "$GITHUB_REPOSITORY" \
            --ref "$SNAPSHOT_BRANCH" -f dry_run=false
