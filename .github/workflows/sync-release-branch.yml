name: Sync dev into release branch

# A long-lived release branch drifts from dev a little every day, and the cost
# of reconciling it grows faster than the drift: three weeks of divergence took
# an afternoon, where the same commits absorbed two at a time would have been
# routine.
#
# This keeps one tracking issue describing what dev has that the release branch
# does not, refreshed on every push to dev and closed again the moment the two
# are back in sync. Editing an issue body sends no notifications, so the only
# time this is loud is when the divergence is new.
#
# Deliberately not a pull request. Actions cannot open one without a repository
# setting, and a PR it did open would not start CI -- so its merge button would
# land an unverified merge. Conflicts want resolving locally anyway; the issue
# says exactly which files and gives the command.

permissions:
  contents: read
  issues: write

on:
  push:
    # The release branch is listed too so catching it up closes the issue
    # straight away, rather than leaving a stale one until dev next moves.
    # Keep it in step with TARGET_BRANCH below; `on:` cannot read env.
    branches: [dev, feat/career-1.9]
  workflow_dispatch:

env:
  # The in-flight release branch. Point this at the next one when this ships.
  TARGET_BRANCH: feat/career-1.9
  ISSUE_LABEL: branch-sync

jobs:
  sync:
    # The tracking issue belongs to the canonical repo; on forks the
    # dev branch and issue tracker are absent, so every run just
    # failed red on push (2026-07-27). No-op anywhere but upstream.
    if: github.repository == 'Orinks/Freight-Fate'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Report what dev owes the release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Nobody is watching this run, so a blip on the GitHub API must not
          # be the reason a merge goes unnoticed for a week. Observed: a 502
          # from the GraphQL endpoint on the very first run.
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 3 ]; then
                echo "'$*' failed $attempt times; giving up." >&2
                return 1
              fi
              echo "'$*' failed; retrying in $((attempt * 5))s." >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          find_issue() {
            gh issue list --repo "$GITHUB_REPOSITORY" \
              --label "$ISSUE_LABEL" --state open \
              --json number --jq '.[0].number // empty' > issue.txt
          }

          if ! git rev-parse --verify "origin/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "No $TARGET_BRANCH branch; nothing to sync."
            echo "Release branch \`$TARGET_BRANCH\` does not exist." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          retry find_issue
          EXISTING=$(cat issue.txt)

          if git merge-base --is-ancestor origin/dev "origin/$TARGET_BRANCH"; then
            echo "$TARGET_BRANCH already contains dev."
            echo "\`$TARGET_BRANCH\` is up to date with dev." >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$EXISTING" ]; then
              retry gh issue close "$EXISTING" --repo "$GITHUB_REPOSITORY" \
                --comment "\`$TARGET_BRANCH\` has caught up with dev."
            fi
            exit 0
          fi

          PENDING=$(git log --oneline "origin/$TARGET_BRANCH..origin/dev" | wc -l)

          # merge-tree reports conflicts without checking anything out, so the
          # report is accurate without touching either branch.
          CONFLICTS=""
          if OUT=$(git merge-tree --write-tree --name-only \
                     "origin/$TARGET_BRANCH" origin/dev 2>/dev/null); then
            VERDICT="Merges cleanly."
          else
            CONFLICTS=$(printf '%s\n' "$OUT" | tail -n +2 | sed '/^$/,$d')
            COUNT=$(printf '%s\n' "$CONFLICTS" | grep -c . || true)
            VERDICT="**Conflicts in $COUNT file(s):**"
          fi

          {
            echo "$PENDING commit(s) on dev have not reached \`$TARGET_BRANCH\`."
            echo
            echo "$VERDICT"
            if [ -n "$CONFLICTS" ]; then
              echo
              printf '%s\n' "$CONFLICTS" | sed 's/^/- `/;s/$/`/'
            fi
            echo
            echo '```'
            echo "git checkout $TARGET_BRANCH && git merge origin/dev"
            echo '```'
            echo
            echo "Waiting on the release branch:"
            echo
            git log --format='- %h %s' "origin/$TARGET_BRANCH..origin/dev"
            echo
            echo "_Refreshed whenever dev moves; closes itself once the two"
            echo "branches are back in sync._"
          } > body.md

          cat body.md >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$EXISTING" ]; then
            echo "Refreshing issue #$EXISTING."
            retry gh issue edit "$EXISTING" --repo "$GITHUB_REPOSITORY" --body-file body.md
          else
            retry gh issue create --repo "$GITHUB_REPOSITORY" \
              --label "$ISSUE_LABEL" \
              --title "dev is ahead of $TARGET_BRANCH" \
              --body-file body.md
          fi
