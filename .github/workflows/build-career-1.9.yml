name: Career 1.9 snapshot

on:
  schedule:
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip release creation"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: career-19-snapshot
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  CAREER_BRANCH: "feat/career-1.9"

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      tag: ${{ steps.check.outputs.tag }}
      commit_sha: ${{ steps.check.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.CAREER_BRANCH }}
          fetch-depth: 0

      - name: Check snapshot conditions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "tag=1.9-tester-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LAST_TAG=$(git tag --list "1.9-tester-*" --sort=-version:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh release view "$LAST_TAG" --json body -q .body > previous-notes.md || true
          : > latest-stable-notes.md
          LATEST_STABLE_TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // ""')
          if [ -n "$LATEST_STABLE_TAG" ]; then
            gh release view "$LATEST_STABLE_TAG" --json body -q .body > latest-stable-notes.md || true
          fi
          python3 tools/release_notes.py should-build-nightly \
            --previous-tag "$LAST_TAG" \
            --exclude-notes previous-notes.md \
            --latest-stable-tag "$LATEST_STABLE_TAG" \
            --exclude-stable-notes latest-stable-notes.md \
            >> "$GITHUB_OUTPUT"

  build_windows:
    name: Build (Windows)
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      FREIGHT_FATE_NO_SPEECH: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target directory
        # Same shape as rust.yml: keyed on lockfile + rustc, target pruned
        # to dependency artefacts before saving. This is what keeps the
        # bundled SDL2 (and everything else) from recompiling every run.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: career-19-snapshot-windows

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Fetch BASS
        # Audio tests skip when the proprietary BASS runtime is absent. Fetch
        # and verify it before Clippy or Cargo tests so a clean runner cannot
        # report green without exercising the audio backend.
        run: |
          uv run python tools/fetch_bass.py
          uv run python tools/fetch_bass.py --check

      - name: Lint Rust targets
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        # The FULL suite: no `--cfg ci_quick`, so the whole-map sweeps the
        # per-push workflow (rust.yml) leaves out run here every night.
        run: cargo test -p ff-core -p freight-fate

      - name: Build the portable release
        run: ./build-release.ps1 --tag "${{ needs.prepare.outputs.tag }}"

      - uses: actions/upload-artifact@v7
        with:
          name: Windows
          path: dist/FreightFate-*-windows-portable.zip
          if-no-files-found: error

  build_macos:
    name: Build (macOS Apple Silicon)
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      FREIGHT_FATE_NO_SPEECH: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      # The bundled SDL2 source declares a cmake_minimum_required older
      # than CMake 4 accepts; this is CMake's own escape hatch for exactly
      # that, and building SDL2 in is what keeps sdl2-compat/SDL3 out.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target directory
        # Same shape as rust.yml: keyed on lockfile + rustc, target pruned
        # to dependency artefacts before saving. This is what keeps the
        # bundled SDL2 (and everything else) from recompiling every run.
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: career-19-snapshot-macos

      # No brewed SDL: Homebrew's sdl2 is sdl2-compat, which loads SDL3 at
      # runtime and dies on player Macs without Homebrew. SDL2 is compiled
      # from source into the executable (`bundled` + `static-link`) using
      # the runner's preinstalled cmake; the staging step fails the build
      # if the executable links any SDL dynamically.

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Fetch BASS
        run: |
          uv run python tools/fetch_bass.py
          uv run python tools/fetch_bass.py --check

      - name: Lint Rust targets
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test -p ff-core -p freight-fate

      - name: Build the macOS release
        # --smoke boots the PACKAGED app for five frames with dummy drivers:
        # real dylib loading, real data, real boot. The old non-launch mode
        # existed because hosted runners hung before first log -- the boot
        # probes (speech, audio device) that 2026-08-30 moved onto worker
        # threads; with them gone the launch proof is back. Bounded at 120 s
        # inside the builder, which dumps the game log on failure.
        run: uv run python tools/build_release.py --rust --smoke --tag "${{ needs.prepare.outputs.tag }}"

      - uses: actions/upload-artifact@v7
        with:
          name: macOS-arm64
          path: dist/FreightFate-*-macos-arm64.zip
          if-no-files-found: error

  build_linux:
    name: Build (Linux ${{ matrix.arch }})
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    # 22.04, not latest: the executable carries its build host's glibc as a
    # floor (2.35 here), and one built on 24.04 would refuse to start on any
    # distribution still shipping an older release, with no useful error.
    # SDL2 is compiled in, so nothing else of the host is linked; Prism's
    # own floor is 2.34 (a manylinux_2_34 wheel).
    #
    # Two native builds, one per CPU: x86_64 for PCs and aarch64 for the
    # Blazie BT Speak and BT Braille (Debian on a Raspberry Pi Compute
    # Module 4 and 5), Raspberry Pi desktops and other ARM64 Linux. The ARM
    # runner is GitHub's hosted `ubuntu-22.04-arm`, same glibc floor. The
    # steps are identical: fetch_bass.py, build_release.py and
    # build_appimage.py each pick their architecture from `uname -m`.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            tarball: linux-x64
          - arch: aarch64
            runner: ubuntu-22.04-arm
            tarball: linux-arm64
    env:
      FREIGHT_FATE_NO_SPEECH: "1"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      # Same escape hatch as the Mac job: the bundled SDL2 declares a
      # cmake_minimum_required older than CMake 4 accepts. 22.04 ships
      # CMake 3.22, where this is a no-op, but the image updates.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0
          lfs: true

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: career-19-snapshot-linux-${{ matrix.arch }}

      # SDL2 is compiled from source into the executable (`bundled` +
      # `static-link`), and what it can open at run time is decided by the
      # headers present now: a video or audio backend whose development
      # package is missing here is compiled out for every player. So the
      # whole desktop set goes in -- X11, Wayland with libdecor, PulseAudio,
      # PipeWire, ALSA, D-Bus for IBus -- although the runner uses none of
      # it. libdbus-1-dev is also what `keyring` links for the Secret
      # Service; desktop-file-utils validates the AppImage's launcher entry.
      - name: Install SDL2 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev libxfixes-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev \
            libdbus-1-dev libudev-dev libibus-1.0-dev \
            file desktop-file-utils

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Fetch BASS
        run: |
          uv run python tools/fetch_bass.py
          uv run python tools/fetch_bass.py --check

      - name: Lint Rust targets
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test -p ff-core -p freight-fate

      - name: Build the Linux release
        # --smoke boots the staged tarball payload for five frames with dummy
        # drivers, the same proof the Mac job gets. Staging refuses an
        # executable that links SDL2 dynamically and a payload missing BASS,
        # its decoders, or Prism with its bundled speech-dispatcher.
        run: uv run python tools/build_release.py --rust --smoke --tag "${{ needs.prepare.outputs.tag }}"

      - name: Package the AppImage
        timeout-minutes: 15
        run: uv run python tools/build_appimage.py --rust --tag "${{ needs.prepare.outputs.tag }}"

      - uses: actions/upload-artifact@v7
        with:
          name: Linux-${{ matrix.arch }}
          path: |
            dist/FreightFate-*-${{ matrix.tarball }}.tar.gz
            dist/FreightFate-*-linux-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  smoke_linux:
    name: Smoke (${{ matrix.image }}, ${{ matrix.arch }})
    needs: [prepare, build_linux]
    # The build host proves one distribution. Players run the others, and
    # what differs between them -- glibc, the dynamic loader, which
    # libraries a desktop install carries -- is exactly what a build on
    # Ubuntu cannot see. So the tarball and the AppImage are both booted,
    # untouched, on each of the popular families, in a bare container that
    # has less than any desktop does.
    #
    # The same matrix runs again on an ARM64 runner against the aarch64
    # downloads, minus Arch: Docker Hub's archlinux image is amd64 only
    # (Arch Linux ARM is a separate project with no official image). The
    # Debian containers there are the nearest stand-in for the BT Speak and
    # BT Braille, which are Debian on a Raspberry Pi Compute Module.
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        image:
          - ubuntu:22.04
          - ubuntu:24.04
          - debian:12
          - debian:13
          - fedora:latest
          - archlinux:latest
          - opensuse/tumbleweed:latest
        exclude:
          - arch: aarch64
            image: archlinux:latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          sparse-checkout: tools/linux_smoke.sh
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v7
        with:
          name: Linux-${{ matrix.arch }}
          path: dist

      - name: Boot the tarball and the AppImage
        run: docker run --rm -v "$PWD:/work" "${{ matrix.image }}" bash /work/tools/linux_smoke.sh

  release:
    name: Release
    needs: [prepare, build_windows, build_macos, build_linux, smoke_linux]
    if: always() && needs.prepare.outputs.should_build == 'true' && needs.build_windows.result == 'success' && needs.build_macos.result == 'success' && needs.build_linux.result == 'success' && needs.smoke_linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          name: Windows
          path: assets

      - uses: actions/download-artifact@v7
        with:
          name: macOS-arm64
          path: assets

      - uses: actions/download-artifact@v7
        with:
          name: Linux-x86_64
          path: assets

      - uses: actions/download-artifact@v7
        with:
          name: Linux-aarch64
          path: assets

      - name: Verify release archives
        shell: bash
        run: |
          shopt -s nullglob
          windows_archives=(assets/FreightFate-*-windows-portable.zip)
          if [ "${#windows_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one Windows portable archive; found ${#windows_archives[@]}." >&2
            exit 1
          fi
          macos_archives=(assets/FreightFate-*-macos-arm64.zip)
          if [ "${#macos_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one Apple Silicon macOS archive; found ${#macos_archives[@]}." >&2
            exit 1
          fi
          linux_archives=(assets/FreightFate-*-linux-x64.tar.gz)
          if [ "${#linux_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux tarball; found ${#linux_archives[@]}." >&2
            exit 1
          fi
          linux_appimages=(assets/FreightFate-*-linux-x86_64.AppImage)
          if [ "${#linux_appimages[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux AppImage; found ${#linux_appimages[@]}." >&2
            exit 1
          fi
          linux_arm64_archives=(assets/FreightFate-*-linux-arm64.tar.gz)
          if [ "${#linux_arm64_archives[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux ARM64 tarball; found ${#linux_arm64_archives[@]}." >&2
            exit 1
          fi
          linux_arm64_appimages=(assets/FreightFate-*-linux-aarch64.AppImage)
          if [ "${#linux_arm64_appimages[@]}" -ne 1 ]; then
            echo "Expected exactly one Linux ARM64 AppImage; found ${#linux_arm64_appimages[@]}." >&2
            exit 1
          fi

      - name: Prepare and verify release notes and checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          (cd assets && sha256sum FreightFate-*-windows-portable.zip FreightFate-*-macos-arm64.zip FreightFate-*-linux-x64.tar.gz FreightFate-*-linux-x86_64.AppImage FreightFate-*-linux-arm64.tar.gz FreightFate-*-linux-aarch64.AppImage > checksums.txt)
          (cd assets && sha256sum -c checksums.txt)

          LAST_TAG=$(git tag --list "1.9-tester-*" --sort=-version:refname | grep -v "^$TAG$" | head -1)
          if [ -n "$LAST_TAG" ]; then
            gh release view "$LAST_TAG" --json body -q .body > previous-notes.md || true
            python3 tools/release_notes.py nightly \
              --previous-tag "$LAST_TAG" \
              --exclude-notes previous-notes.md \
              --output notes.md
          else
            python3 tools/release_notes.py nightly --first-snapshot --output notes.md
          fi
          test -s notes.md
          python3 tools/release_notes.py check-size --input notes.md --max-characters 120000
          test -s assets/checksums.txt

      - name: Create prerelease
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          COMMIT_SHA: ${{ needs.prepare.outputs.commit_sha }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" -y --cleanup-tag
          elif git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git push origin ":refs/tags/$TAG"
          fi
          gh release create "$TAG" assets/* --notes-file notes.md \
            --title "Freight Fate 1.9 tester snapshot $(date -u +%Y-%m-%d)" \
            --prerelease --target "$COMMIT_SHA"
