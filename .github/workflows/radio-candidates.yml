name: Radio candidate sweep (temporary)

permissions:
  contents: write

on:
  push:
    branches: [claude/project-thread-p7r8r9]
    paths: [audit/candidates.json]

jobs:
  sweep:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Audit
        run: |
          python3 tools/audit_radio_streams.py --urls audit/candidates.json \
            --seconds 25 --shard ${{ matrix.shard }}/4 --workers 24 \
            --output radio-audit-${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: radio-audit-${{ matrix.shard }}
          path: radio-audit-${{ matrix.shard }}.json

  merge:
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v7
        with:
          pattern: radio-audit-*
          merge-multiple: true
      - name: Merge and commit
        run: |
          python3 - <<'PY'
          import glob, json
          results = []
          for path in sorted(glob.glob("radio-audit-*.json")):
              results += json.load(open(path))["results"]
          results.sort(key=lambda r: r["id"])
          counts = {}
          for r in results:
              counts[r["verdict"]] = counts.get(r["verdict"], 0) + 1
          print(counts)
          json.dump({"counts": counts, "results": results}, open("audit/candidates-audit.json", "w"), indent=1, ensure_ascii=False)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audit/candidates-audit.json
          git commit -m "chore: radio candidate report [skip changelog] [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
